manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: charlesmst
      url-base: https://github.com/charlesmst
    - name: hsgw
      url-base: https://github.com/hsgw
    - name: damex
      url-base: https://github.com/damex
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
    - name: urob
      url-base: https://github.com/urob
    - name: ggrocer
      url-base: https://github.com/greengrocer98

  projects:
    - name: zmk
      remote: charlesmst
      revision: feat/deskhop-sync
      import: app/west.yml

    - name: zmk-pmw3610-driver
      remote: charlesmst
      repo-path: zmk-pmw3610-driver-efog
      revision: zmk0.4

    - name: zmk-paw3395-driver
      remote: ggrocer
      revision: main

    - name: zmk-vfx-rgbled-indicator
      remote: ggrocer
      revision: main

    # charlesmst fork: adds a zmk_display_status_screen() prototype so the
    # module's -Werror=missing-prototypes build passes against ZMK's K&R header.
    - name: zmk-vfx-retro
      remote: charlesmst
      revision: compat/zmk-status-screen-prototype

    - name: zmk-input-processor-accel
      remote: charlesmst
      revision: main

    - name: zmk-tri-state
      path: modules/zmk/tri-state
      remote: charlesmst
      revision: feat/hold-start

    - name: zmk-behavior-stepped-scroll
      remote: damex
      revision: main

    - name: zmk-behavior-button-direct
      remote: damex
      revision: v0.1.1

    # KNOWN ISSUE (trial): this module's CMakeLists adds `-Werror
    # -Wduplicated-branches` to its own library. Zephyr's Z_CBPRINTF_IS_X_PCHAR
    # expands to `cond ? 0 : 0` for non-pointer args, so every LOG_* call in the
    # driver fails the build under GCC 12.2 (SDK 0.16.8, and ZMK's CI image).
    # Worked around locally by appending `-Wno-error=duplicated-branches` to
    # zmk-driver-stepped-encoder/CMakeLists.txt -- NOT committed, `west update`
    # wipes it and CI on this branch will fail until upstream relaxes the flag.
    - name: zmk-driver-stepped-encoder
      remote: damex
      revision: v0.1.0

    - name: zmk-feature-sensor_rotation
      remote: hsgw
      revision: main

    - name: zmk-feature-split-esb
      remote: damex
      revision: v0.6.4
      import: true

  self:
    path: config

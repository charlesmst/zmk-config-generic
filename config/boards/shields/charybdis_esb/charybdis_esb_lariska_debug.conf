# Debug overlay for the lariska build, for -DEXTRA_CONF_FILE together with the
# zmk-usb-logging snippet. Not picked up by the normal build.
#
# Plug the lariska's USB port into a PC and it shows up as a serial console. The
# USB device stack comes from ZMK_USB_LOGGING (the snippet) and usb.c enables
# it; ZMK_USB (HID to a host) stays off, this node is an ESB peripheral.
#
# ZMK's own debug output is silenced (MINIMAL) so the console carries the ESB
# lines: split-esb v0.8.11 prints a per-second stats line on every role at DBG.
# Logging is not free -- on the relay dongle, console logging at DBG made the
# pointer stutter at a 1 ms poll -- so judge smoothness on the normal build.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_WRN=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000

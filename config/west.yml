manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: charlesmst
      url-base: https://github.com/charlesmst
    - name: hsgw
      url-base: https://github.com/hsgw
    - name: damex
      url-base: https://github.com/damex
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
    - name: urob
      url-base: https://github.com/urob
    - name: ggrocer
      url-base: https://github.com/greengrocer98
    - name: carrefinho
      url-base: https://github.com/carrefinho

  projects:
    - name: zmk
      remote: charlesmst
      revision: feat/deskhop-sync
      import: app/west.yml

    - name: zmk-pmw3610-driver
      remote: charlesmst
      repo-path: zmk-pmw3610-driver-efog
      revision: zmk0.4

    - name: zmk-paw3395-driver
      remote: ggrocer
      revision: main

    - name: zmk-vfx-rgbled-indicator
      remote: ggrocer
      revision: main

    # charlesmst fork: adds a zmk_display_status_screen() prototype so the
    # module's -Werror=missing-prototypes build passes against ZMK's K&R header.
    - name: zmk-vfx-retro
      remote: charlesmst
      revision: compat/zmk-status-screen-prototype

    - name: zmk-input-processor-accel
      remote: charlesmst
      revision: main

    - name: zmk-tri-state
      path: modules/zmk/tri-state
      remote: charlesmst
      revision: feat/hold-start

    - name: zmk-behavior-stepped-scroll
      remote: damex
      revision: main

    - name: zmk-behavior-button-direct
      remote: damex
      revision: v0.1.1

    # v0.1.1 drops -Wduplicated-branches from the module's own -Werror set.
    # v0.1.0 could not build: Zephyr's Z_CBPRINTF_IS_X_PCHAR expands to
    # `cond ? 0 : 0` for non-pointer args, so LOG_ERR("...(%d)", error) in
    # stepped_encoder.c failed under GCC 12.2 (SDK 0.16.x, incl. ZMK's CI image).
    - name: zmk-driver-stepped-encoder
      remote: damex
      revision: v0.1.1

    - name: zmk-feature-sensor_rotation
      remote: hsgw
      revision: main

    # Prospector dongle (XIAO nRF52840 + Waveshare 1.69" round LCD).
    #
    # Branched from upstream feat/new-status-screens, not main: main targets
    # ZMK v0.3 / Zephyr 3.5, and this workspace is Zephyr 4.1 with
    # hardware-model-v2 board names (xiao_ble//zmk).
    #
    # charlesmst fork: the module assumes a BLE split central. It compiles
    # central_status_changed_observer.c unconditionally, which cannot build
    # without a BT stack (reads info.le.phy->rx_phy), and classic/output.c
    # links against zmk_ble_profile_*. The branch gates both on
    # CONFIG_ZMK_BLE / CONFIG_ZMK_SPLIT_BLE and changes nothing for BLE users.
    # Upstreamable as-is; drop the fork if it lands.
    - name: prospector-zmk-module
      remote: charlesmst
      revision: compat/no-split-ble

    - name: zmk-feature-split-esb
      remote: damex
      # v0.7.4 -> v0.8.5: six releases. v0.8.0 relay-pointer input processor +
      # central-has-own-host relay pause, v0.8.1 queued mouse buttons, v0.8.2
      # idle relay ACKs go out empty, v0.8.3 wire change (relay control tags
      # 0xFC -> 0xFB, new ESB_RELAY_POLL_TAG), v0.8.4 relay hop on poll tick,
      # v0.8.5 steps relay hop windows on the keepalive again (reverting the
      # v0.8.4 poll-tick move) and grades a hop window by its mean TX attempts
      # instead of its worst packet -- that last part applies to the halves too,
      # so hop sensitivity on left/right/lariska changes here.
      #
      # v0.8.6 is two commits. e777386 is relay-only (pointer axes as running
      # totals) and inert in this topology, where the dongle is the central and
      # nothing is relayed. 03797a1 is not: lossy relative axes go out as
      # cumulative values and the keepalive carries the low 16 bits of each
      # axis total, so motion lost in a dropped noack packet heals on the next
      # tick instead of vanishing. That is lariska's trackball here.
      #
      # It breaks the uplink wire in both directions. The keepalive gains a
      # motion-total count byte between the held-key list and the sensor
      # totals, so a v0.8.5 peripheral trips the new
      # `length <= motion_count_offset` guard on a v0.8.6 central, and a
      # v0.8.6 peripheral fails the old (length - totals_offset) % 8 check on a
      # v0.8.5 central. Either way esb_keepalive_matches returns false and the
      # central drops every keepalive -- battery level, hop state, link cost
      # and held-key reconciliation all go dark, silently, since these builds
      # run CONFIG_LOG=n. So the dongle and all three peripherals get flashed
      # together.
      #
      # The longer keepalive also overflows one 48-byte payload on lariska,
      # which is why every roBakesb conf here moves to 56; the arithmetic is in
      # roBakesb_lariska.conf and the packet-time consequence is in
      # roBakesb_addr.dtsi.
      #
      # v0.8.7 is two commits, both about the relay's USB sink: b031cd6 adds a
      # drain mock to the test rig, 2f46d1e "skip motion when relay usb is
      # actually busy".
      #
      # That is the path worth naming here. In v0.8.6 the dongle's
      # deliver_pointer returned early without committing pointer_tracks
      # whenever the HID write failed, so the totals stayed un-baselined and the
      # next report carried the accumulated motion -- lossless by design, but it
      # lands as one larger delta instead of several small ones, which is what
      # bunched motion feels like.
      #
      # v0.8.7 -> v0.8.9 is mostly test rig and refactor (mock harness, pipe
      # role lookup tables, ternaries unrolled). Three commits touch behaviour,
      # all of them about telling a failed transmit apart from an unacked one:
      #
      #   5b423da (v0.8.8) grades a hop window on its acked transmits only --
      #     a fire-and-forget send raises TX_SUCCESS on the first attempt
      #     whether or not anyone heard it, so counting it flattered the window.
      #   a97cb28 (v0.8.8) stops one failure inside a tick from marking the link
      #     down when a later packet got through: hop_note_tx_failed now clears
      #     tx_succeeded_since_tick, and settle_link_state keeps the link up on
      #     a success it can prove was acked.
      #   e989fd4 (v0.8.9) has the central stage a pipe's ACK reply only for a
      #     packet that asked for an ACK. The ACK FIFO is shared across pipes,
      #     and a noack packet consumes no slot, so a reply written for one
      #     could sit there and squeeze the pipes that do ack.
      #
      # Two of the three were inert when this landed and are not any more.
      # At the time nothing in the rig sent fire-and-forget -- the uplink was
      # fully lossless, so event_wants_ack was always true, and the keepalive
      # and the relay poll both go out with noack = 0. No hop window had a
      # noack packet to exclude, and pipes_acked always equalled the old
      # pipes_seen. roBakesb_addr.dtsi has since put lossy-codes back on
      # REL_X/REL_Y as a relay diagnostic, so both commits now do real work on
      # the halves' motion traffic. That was part of the reason to try it.
      #
      # a97cb28's link-state half was never inert, and it is the reason to take
      # this release. The relay dongle polls at 2 ms, and at the 0.2-0.6%
      # baseline loss measured on v0.8.7 a failure lands in roughly every other
      # 32 ms hop window. Under v0.8.7 any such failure dropped link_acked for
      # that window regardless of the ~15 polls around it that were acked, and
      # link_acked is what esb_link_role_retry_failed_tx consults before
      # retrying a failed TX -- a down link gives up and waits for the next
      # tick. That is the shape of the bursts in the v0.8.7 capture: 190-284
      # consecutive poll failures over 1-2 s, recurring every 3-80 s, with the
      # inter-packet spacing collapsing from 100-900 ms to 4-9 ms.
      #
      # The three commits alone would have needed only the relay and the
      # central: the wire is unchanged in both directions and left/lariska see
      # no behaviour change from them. Restoring lossy-codes does change the
      # wire, though -- PERIPHERAL_MOTION_TOTALS_MAX goes from 0 to 2, so the
      # keepalive grows a motion-totals section and esb_keepalive_matches on a
      # peripheral still built without it rejects the central's view of the
      # link. So every node gets flashed together: left, lariska, the relay and
      # the central.
      revision: v0.8.9
      import: true

  self:
    path: config

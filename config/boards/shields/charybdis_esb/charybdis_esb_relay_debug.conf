# Console logging for the relay dongle (holyiot_dongle_1k wires zephyr,console
# to its CDC ACM port). Costs pointer smoothness at a 1 ms poll, so debugging
# only. ZMK_USB_LOGGING is not usable here because ZMK_USB is off, so enable the
# Zephyr log subsystem directly. split-esb v0.8.10 prints a per-second counter
# line at DBG: polls sent/refused, tx acked/failed, new motion, usb took/refused.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=500

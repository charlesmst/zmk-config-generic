CONFIG_ZMK_KEYBOARD_NAME="roBa KESB Relay"

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
# ESB peripheral: CONFIG_ZMK_SPLIT_ROLE_CENTRAL stays unset.

# ZMK's own USB HID stack is off on purpose. The relay registers HID_0 itself
# (zmk-feature-split-esb/src/esb_hid_relay_usb.c) with ZMK's report descriptor,
# and both would fight over the same Zephyr HID device.
CONFIG_ZMK_USB=n

CONFIG_ZMK_SPLIT_ESB=y
# Relay role: receive HID reports from the central and write them to USB.
# Poll period is what bounds the added HID latency.
CONFIG_ZMK_SPLIT_ESB_HID_RELAY=y
CONFIG_ZMK_SPLIT_ESB_HID_RELAY_POLL_MS=4
CONFIG_ZMK_SPLIT_ESB_HID_RELAY_KEEPALIVE_MS=4
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=48
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1), or equal-priority
# ISR latency can wedge the ESB ACK/retransmit state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_CRC=y

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y

# Bus-powered and it must answer the host at all times.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY=n
CONFIG_ZMK_BATTERY_REPORTING=n

CONFIG_USB_DEVICE_PRODUCT="roBa KESB Relay"

# Logging out of the board's CDC ACM console (holyiot_dongle_1k.dts wires
# zephyr,console to it). ZMK_USB_LOGGING is not usable here because ZMK_USB is
# off, so enable the Zephyr log subsystem directly. The ESB module only logs on
# error paths, so DBG does not flood the 4 ms poll loop.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=500

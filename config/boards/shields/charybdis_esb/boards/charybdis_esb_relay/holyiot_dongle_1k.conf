# Shield-specific override for the relay dongle. The dongle-central build's
# board files live in boards/charybdis_esb/ for the same reason: Zephyr matches
# a bare boards/holyiot_dongle_1k.* on the board alone, so it would land on this
# shield too (and its overlay references the dongle's &oled).
#
# These two indicators are central-only: ROBA_PERIPHERAL_BATTERY_LED depends on
# ZMK_SPLIT_ROLE_CENTRAL and ROBA_LAYER_LED reads keymap layer state. The relay
# is a peripheral with no keymap, so turn them off rather than leave unmet
# dependencies in the build.
CONFIG_ROBA_PERIPHERAL_BATTERY_LED=n
CONFIG_ROBA_LAYER_LED=n

# Diagnostic fragment: is the Prospector's touch panel reachable?
#
# Self-contained -- turns logging back on and enables the i2c1 scan. Build it
# by hand, it is not a build.yaml target:
#
#   see docs/prospector-dongle.md "Is there a touch panel?"
#
# Watch the USB CDC console for:
#   i2c probe: 0x39 responded <- APDS9960 light/gesture (expected)
#   i2c probe: 0x15 responded <- CST816S touch (Waveshare 1.69" panel)
#
# 0x15 present  -> the digitizer is wired, touch UI is buildable as designed.
# only 0x39      -> touch is not routed; input comes from APDS9960 gestures.
# nothing at all -> i2c1 itself is wrong, before concluding anything about touch.
#
# The scan repeats every 8 s, so the answer appears shortly after you attach the
# console rather than only once at boot.

CONFIG_ROBA_PROSPECTOR_I2C_PROBE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=500

# INF, not DBG. split-esb v0.7.x builds its own library with
# -Werror -Wstack-usage=256, and at DBG esb_link_init measures 264 bytes
# because esb_link_radio_setup's six LOG_DBG calls inline into it. DBG does not
# build at all here.
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_INF=y

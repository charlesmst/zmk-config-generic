CONFIG_ZMK_KEYBOARD_NAME="Charybdis ESB Relay"

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
# ESB peripheral: CONFIG_ZMK_SPLIT_ROLE_CENTRAL stays unset.

# ZMK's own USB HID stack is off on purpose. The relay registers HID_0 itself
# (zmk-feature-split-esb/src/esb_hid_relay_usb.c) with ZMK's report descriptor,
# and both would fight over the same Zephyr HID device.
CONFIG_ZMK_USB=n

CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_HID_RELAY=y
# Relay poll period, and with it the added HID latency: a relay dongle runs its
# own tick at exactly this rate and each poll's ACK carries whatever the central
# has queued for this pipe. 1 ms, matching the roBakesb relay. Measured there on
# split-esb v0.8.9/v0.8.10 with 4 retransmits at 600 us; the pointer lands at
# up to half this rate (the central's ACK payload is preloaded), and the
# trackball's 2 ms report interval is the other ceiling.
CONFIG_ZMK_SPLIT_ESB_HID_RELAY_POLL_MS=1
# 56 rig-wide: lariska's keepalive hits 53 bytes with the lossy REL_X/REL_Y
# section declared in charybdis_esb_addr.dtsi. Set uniformly so no receiver is
# ever the smaller end of a link.
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=56
CONFIG_ESB_MAX_PAYLOAD_LENGTH=56
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1), or equal-priority
# ISR latency can wedge the ESB ACK/retransmit state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_CRC=y

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y

# Bus-powered and it must answer the host at all times.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY=n
CONFIG_ZMK_BATTERY_REPORTING=n

CONFIG_USB_DEVICE_PRODUCT="Charybdis ESB Relay"

# Logging off. On the roBakesb relay, console logging at DBG over the board's
# CDC ACM port made the pointer stutter at a 1 ms poll and removing it stopped
# it, so the shipped build stays quiet. To get the per-second relay stats line
# back, build with -DEXTRA_CONF_FILE=charybdis_esb_relay_debug.conf (and the
# hop/poll logging that goes with it).
CONFIG_LOG=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Logging off entirely: drops the log thread and its 4 KB buffer, and removes
# the DBG-level string formatting that ran inside the ESB send path. This half
# is the most timing-sensitive of the three -- PAW3395 at 1 kHz feeding an ESB
# link whose retransmit budget is tuned to a ~3.7 ms blocking window.
# Re-enable over RTT with -DEXTRA_CONF_FILE=roBakesb_debug.conf.
CONFIG_LOG=n

CONFIG_ZMK_KEYBOARD_NAME="roBa KESB Lariska"

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_INPUT=y
CONFIG_GPIO=y
CONFIG_SPI=y

# Sleep after 2 h idle. Wakes on kscan (mouse buttons); cursor motion alone
# does not wake (driver has no motion wake source).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
# 56, where this rig ran at 48 up to split-esb v0.8.5. Headroom, not necessity
# -- the earlier version of this note said necessity and was wrong, so the
# arithmetic is spelled out here.
#
# v0.8.6 adds a lossy-motion-total section to the uplink keepalive, sized by the
# lossy-codes property. roBakesb_addr.dtsi deliberately omits lossy-codes (the
# uplink is fully lossless here), so PERIPHERAL_MOTION_TOTALS_MAX is 0 and the
# section costs exactly its one count byte. lariska's compile-time worst case:
#
#   13  header: tag, hop state, 8-byte position bitmap, battery, link cost,
#       held-key count
#   15  5 held input keys x 3 B   CONFIG_ZMK_INPUT_SPLIT_MAX_TRACKED_KEYS=5
#    1  lossy motion total count  new in v0.8.6, and all it costs with no
#                                 lossy-codes declared
#    0  no motion totals          the uplink is lossless again, see
#                                 roBakesb_addr.dtsi
#   16  2 sensor totals x 8 B     roBakesb_lariska.overlay sensors =
#                                 <&_ph_enc &lariska_encoder>
#   --
#   45  fits 48
#
# So 48 would build. 56 stays anyway, as headroom: lossy-codes has now been on
# once (594f142, as a probe for the HID relay) and may go on again, and when it
# does this list becomes
#
#    1  count byte
#    8  2 motion totals x 4 B     ESB_KEEPALIVE_MOTION_BYTES, not the 8 B the
#                                 sensor totals use
#   --
#   53  fits 56, does NOT fit 48
#
# which is the whole point of not migrating the payload size back and forth.
# At 48 that variant stops the build with a keepalive BUILD_ASSERT that points
# nowhere near lossy-codes.
#
# Both halves are well under either way: left 37 (one encoder), right 29 (none).
# The phantom encoder costs lariska 8 bytes purely to keep its keymap sensor
# indices aligned with the central's, which is why lariska is the tight one at
# all -- not the trackball.
#
# Air cost is nil: esb_link.c sets config.protocol = ESB_PROTOCOL_ESB_DPL, so
# every packet carries its own length and raising the maximum only grows the
# TX/RX FIFO buffers.
#
# It does not eat into retransmit-delay-us either, which was worth checking
# since that is tuned to 600 in roBakesb_addr.dtsi. The ESB driver's ACK window
# is wait_for_ack_timeout_us, a fixed per-bitrate constant
# (RX_ACK_TIMEOUT_US_2MBPS = 160, esb.c) covering ramp-up plus the ACK's
# address event -- not the ACK payload's air time. The retransmit timer is
# armed at retransmit_delay - ramp_up and cancelled once the ACK completes, so
# the budget a longer ACK spends against is ~560 us versus ramp-up plus 266 us
# for a full 56-byte ACK at 2 Mbps. Payload length does not enter the timeout.
#
# The two must stay equal: esb_link.c BUILD_ASSERTs it, because NCS's
# CONFIG_ESB_MAX_PAYLOAD_LENGTH default (32) wins over the module's on Kconfig
# parse order.
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=56
CONFIG_ESB_MAX_PAYLOAD_LENGTH=56
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1): the ESB driver
# arms its ACK/retransmit timers inside this ISR within ~170-520us windows, and an
# equal-priority ISR delaying it past a window wedges the radio state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_CRC=y


CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60


CONFIG_PAW3395=y
CONFIG_PAW3395_REPORT_INTERVAL_MIN=1

# Battery indicator LED (RGB)
CONFIG_VFX_RGBLED_INDICATOR=y
CONFIG_VFX_LDO_PIN=y
CONFIG_VFX_CHRG_PIN=y

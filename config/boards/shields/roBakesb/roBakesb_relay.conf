CONFIG_ZMK_KEYBOARD_NAME="roBa KESB Relay"

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
# ESB peripheral: CONFIG_ZMK_SPLIT_ROLE_CENTRAL stays unset.

# ZMK's own USB HID stack is off on purpose. The relay registers HID_0 itself
# (zmk-feature-split-esb/src/esb_hid_relay_usb.c) with ZMK's report descriptor,
# and both would fight over the same Zephyr HID device.
CONFIG_ZMK_USB=n

CONFIG_ZMK_SPLIT_ESB=y
# Relay role: receive HID reports from the central and write them to USB.
# Poll period is what bounds the added HID latency: a relay dongle runs its own
# tick (hop_peripheral.c, relay_poll_work) at exactly this rate, and each poll's
# ACK carries whatever the central has queued for this pipe.
#
# 2 ms, half the module default. This option drives two things at once:
#
#   1. HID latency. A real change is queued (esb_link_stage_reply ->
#      write_queued_replies) and leaves on the next poll, so worst case is one
#      poll period. A fast poll is cheap here in a way it was not before v0.8.2:
#      back then every ACK carried a full mouse report whether or not the pointer
#      had moved, so polling constantly was the only way to keep a change from
#      waiting, and the air paid for it. v0.8.2 returns an empty ACK on idle
#      polls (esb_hid_relay_pointer_take bails without motion unless the
#      keepalive marked a refresh due), and v0.8.3 shrank the uplink poll to one
#      byte, so a fast poll now costs almost nothing when nothing is happening.
#
#   2. Uplink cost. Since v0.8.3 a poll is one byte (ESB_RELAY_POLL_TAG) that
#      the central drops in hop_consume_rx without queuing, where before each
#      poll was a full keepalive -- 13 bytes minimum -- that it reconciled. The
#      poll is no longer the keepalive, so this no longer has to track
#      hop-window-ms.
#
# Hop adaptation is deliberately *not* on that list. v0.8.4 did tie
# run_hop_window() to the poll tick, which made this option the dongle's channel
# re-evaluation rate too; v0.8.5 reverted it (f8ff827) so a relay steps its hop
# windows on the keepalive "exactly like the halves do", at hop_window_ms.
# Grading a window on a 2 ms cadence judged the channel on too little evidence.
# Do not reintroduce that reasoning when picking a value here.
#
# The ceiling this sets on pointer rate is the other half of the choice, and it
# is not one report per poll. The central's ACK payload is preloaded -- a reply
# it stages while handling poll N goes out on poll N+1, "ACK rides peripheral's
# next transmit" in the module's ARCHITECTURE.md. So the pointer lands at half
# the poll rate, which is what measuring on the host showed on v0.8.5: 2 ms
# gives 250 Hz, 1 ms gives 500 Hz.
#
# How the counts get there changed in v0.8.6 and the old description of it was
# wrong, so: motion is no longer summed into an accumulator that take_delta
# drains. The central sends each axis as a running total and this dongle
# differences it back in pointer_totals_to_deltas once its USB endpoint accepts
# the report. The practical difference is that a missed ACK now costs one poll
# of latency instead of the counts it was carrying -- the next total already
# includes them -- and that while the pointer is moving every ACK reserves room
# for the mouse report (esb_hid_relay_pointer_motion_pending), so motion no
# longer queues behind a burst of key changes. The preload is untouched, so the
# half-the-poll-rate ceiling should still hold.
#
# Re-measured on v0.8.9, at this 2 ms poll, and the "half the poll rate" model
# does not survive it:
#
#   lossy motion (lossy-codes on REL_X/REL_Y)   ~320 Hz
#   lossless motion (no lossy-codes)            ~190 Hz
#
# 320 is above the 250 the preload model predicts, so a poll can evidently
# carry more than one report's worth of motion -- unsurprising once each axis
# is a running total rather than a per-report delta, since one ACK can close
# several host reports' worth of travel. 190 is below it, and that is the
# retransmit budget: a lossless motion batch that needs retransmits occupies
# the radio for several poll periods, so polls that would have carried motion
# arrive with none staged.
#
# So the lossy/lossless choice in roBakesb_addr.dtsi is also a pointer-rate
# knob worth ~130 Hz here, not only a reliability one. Whether 190 Hz is worth
# guaranteed motion delivery is a feel question, not a log question.
#
# 2 ms it is, for 190-320 Hz at the pointer at half the air of 1 ms. Set this to 1 if
# 500 Hz at the pointer is wanted -- that is the only way to get it, and v0.8.3's
# one-byte poll is what makes the doubled poll rate affordable. Either way this
# is the knob for pointer rate, not KEEPALIVE_MS.
#
# USB is not the limit either way: USB_HID_POLL_INTERVAL_MS is 1 on a relay
# dongle, though the HID endpoint serialises on its in_ready callback
# (esb_hid_relay_usb.c), one report per frame, so a poll returning keyboard +
# consumer + pointer still needs ~3 frames to drain.
#
# HID_RELAY_KEEPALIVE_MS is deliberately not set here: it only drives the
# central's refresh work, so it belongs in roBakesb_right_central.conf.
CONFIG_ZMK_SPLIT_ESB_HID_RELAY=y
CONFIG_ZMK_SPLIT_ESB_HID_RELAY_POLL_MS=2
# 56 rig-wide since split-esb v0.8.6, which added a lossy-motion-total section
# to the keepalive. Headroom again now that the uplink is back to lossless --
# lariska, the tightest node, lands at 45 of 48, and at 53 of 56 whenever
# lossy-codes goes back on, which is why the size does not follow it. Set
# uniformly so no receiver is ever the smaller end of a link; the arithmetic,
# and why it costs neither air time nor retransmit-delay margin, are in
# roBakesb_lariska.conf.
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=56
CONFIG_ESB_MAX_PAYLOAD_LENGTH=56
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1), or equal-priority
# ISR latency can wedge the ESB ACK/retransmit state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_CRC=y

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y

# Bus-powered and it must answer the host at all times.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY=n
CONFIG_ZMK_BATTERY_REPORTING=n

CONFIG_USB_DEVICE_PRODUCT="roBa KESB Relay"

# Logging out of the board's CDC ACM console (holyiot_dongle_1k.dts wires
# zephyr,console to it). ZMK_USB_LOGGING is not usable here because ZMK_USB is
# off, so enable the Zephyr log subsystem directly. The ESB module only logs on
# error paths, so DBG does not flood the poll loop.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=500

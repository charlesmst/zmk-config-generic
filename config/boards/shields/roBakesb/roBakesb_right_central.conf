CONFIG_ZMK_KEYBOARD_NAME="roBa KESB"

# Wired USB central. No BLE anywhere in this build.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# ZMK Studio over USB (studio-rpc-usb-uart snippet, see build.yaml).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Damex ESB central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=48
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1), or equal-priority
# ISR latency can wedge the ESB ACK/retransmit state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_CRC=y

# Mirror the keyboard, consumer and pointer HID reports onto every relay-role
# pipe, so the holyiot dongle (roBakesb_relay) can present them on its own USB
# HID endpoint. Pointer input needs the relay_pointer processor in every input
# listener here as well, see roBakesb_right_central.overlay.
#
# Keepalive is the central's refresh of the *idle* reply, not the path a
# keypress takes: a real change is queued (esb_link_stage_reply) and goes out on
# the next poll regardless. The refresh matters for healing a dropped release
# and for a poll that arrives with an empty queue, so match it to the relay's
# HID_RELAY_POLL_MS (1 ms) and every poll gets a fresh report.
#
# At 1 ms the refresh work reschedules itself 1000 times a second on the system
# workqueue. It never skips (hid_relay_keepalive_fire latches unconditionally
# since v0.7.4), but all it does is memcpy the current reports into each relay
# pipe's idle latch -- no radio work, and the consumer drops a latched copy that
# a queued change has overtaken (fresh_idle_reply). If this half ever looks
# starved -- matrix scan, PMW3610 or DeskHop reports lagging -- this is the first
# knob to back off.
#
# Note the relay goes quiet (released keys, zeroed pointer) while this half has
# a host of its own, which with CONFIG_ZMK_USB=y means whenever its USB is
# enumerated -- the pause we asked damex for, landed in v0.8.0. It keys off the
# selected endpoint, so a connected BLE profile would pause it too.
CONFIG_ZMK_SPLIT_ESB_HID_RELAY=y
CONFIG_ZMK_SPLIT_ESB_HID_RELAY_KEEPALIVE_MS=1

# Local PMW3610 trackball on SPI0
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_PMW3610=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ENDPOINT_RATE_NOTIFY=y

CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Wired central: never deep-sleep, that would drop USB and the ESB link.
CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Logging off entirely, matching roBakesb_right. This half is the ESB central
# and runs the retransmit budget tuned in roBakesb_addr.dtsi, so string
# formatting has no business in that path. There is also no log backend here --
# build.yaml gives this target studio-rpc-usb-uart only, which is an RPC
# transport, not a log backend. Re-enable over RTT with
# -DEXTRA_CONF_FILE=roBakesb_debug.conf.
CONFIG_LOG=n

# DeskHop layer sync via vendor HID collection (output A=layer 0, B=layer 1).
# Only this half is wired to DeskHop, so the sync reports land here; the relay
# dongle just mirrors whatever keyboard report results.
CONFIG_ZMK_DESKHOP_SYNC_REPORT=y
CONFIG_ZMK_DESKHOP_SYNC_LAYER_A=0
CONFIG_ZMK_DESKHOP_SYNC_LAYER_B=1
# Base layers a switch must clear: Mac(0) | Windows(1) | Gaming(2). Gaming sits
# above both base layers, so without it in the mask it shadows whichever one
# DeskHop selects and the switch looks like it did nothing.
CONFIG_ZMK_DESKHOP_SYNC_BASE_LAYER_MASK=0x07

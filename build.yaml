---
include:
  - board: xiao_ble//zmk
    shield: settings_reset
  # Roba ESB dongle on Holyiot nRF52840 dongle (no OLED)
  - board: holyiot_dongle_1k
    shield: roBakesb
    snippet: studio-rpc-usb-uart
    artifact-name: roBakesb_dongle_holyiot

  # Prospector dongle: XIAO nRF52840 + 1.69" round LCD. Same ESB central role
  # as the dongles below, with the stock Prospector status screen (layer roller
  # plus a battery bar per peripheral) instead of an RGB LED or OLED.
  - board: xiao_ble//zmk
    shield: roBakesb_prospector prospector_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: roBakesb_dongle_prospector

  # --- HID relay topology ------------------------------------------------
  # Right half is the ESB central and the wired USB keyboard; the holyiot
  # dongle is a relay-role peripheral mirroring the keyboard, consumer and
  # pointer reports onto a second host. roBakesb_left and roBakesb_lariska
  # below are unchanged and serve both topologies.
  - board: xiao_ble//zmk
    shield: roBakesb_right_central
    snippet: studio-rpc-usb-uart
    artifact-name: roBakesb_right_central

  - board: holyiot_dongle_1k
    shield: roBakesb_relay
    artifact-name: roBakesb_relay_holyiot
  # -----------------------------------------------------------------------

  # Damex ESB dongle setup (nice!nano v2 as USB central)
  - board: nice_nano@2.0.0//zmk
    shield: roBakesb
    snippet: studio-rpc-usb-uart
    artifact-name: roBakesb_dongle

  # Damex ESB dongle on Makerdiary nRF52840 MDK USB Dongle
  - board: nrf52840_mdk_dongle
    shield: roBakesb
    snippet: studio-rpc-usb-uart
    artifact-name: roBakesb_dongle_mdk

  - board: xiao_ble//zmk
    shield: roBakesb_left
    artifact-name: roBakesb_left

  - board: xiao_ble//zmk
    shield: roBakesb_right
    artifact-name: roBakesb_right

  # Debug builds: low-battery LED threshold forced to 95% so the blink triggers
  # at normal charge. Flash these to verify the LED, then flash the real
  # roBakesb_left / roBakesb_right (threshold 25%).
  - board: xiao_ble//zmk
    shield: roBakesb_left
    cmake-args: -DCONFIG_ROBA_SELF_BATTERY_LED_THRESHOLD=95
    artifact-name: roBakesb_left_ledtest

  - board: xiao_ble//zmk
    shield: roBakesb_right
    cmake-args: -DCONFIG_ROBA_SELF_BATTERY_LED_THRESHOLD=95
    artifact-name: roBakesb_right_ledtest

  - board: nice_nano@2.0.0//zmk
    shield: roBakesb_lariska
    artifact-name: roBakesb_lariska

  # --- Keychron B1 Pro as a fourth key peripheral --------------------------
  # Dongle-central topology only (pipe 3 is also the relay's). The Keychron
  # adds a peripheral to the ESB link, which changes the beacon every node
  # parses, so the whole link is rebuilt with the roBakesb_keychron_link add-on
  # and reflashed together: the Prospector dongle, left, right, lariska, and
  # the keyboard. Mixing a _keychron image with a plain one on the same link
  # leaves the plain one without the hop epoch. The plain targets above are
  # unchanged and still make the three-peripheral link.
  - board: keychron_b1_pro
    shield: roBakesb_keychron
    artifact-name: roBakesb_keychron_b1_pro

  # RAM: the Keychron's 77 extra positions make every one of the 15 layers 77
  # bindings longer, and ZMK keeps a RAM copy of the keymap for Studio -- 15 x
  # 77 x 16 B = 18.5 KB. The Prospector's two LVGL draw buffers (2 x 67 KB) leave
  # less than that: the first build overflowed RAM by 918 bytes. The behaviors
  # queue is the one allocation here that is oversized -- 512 entries (14 KB) for
  # a keymap whose largest macro is 8 bindings -- so this target halves it,
  # which leaves ~6 KB spare. Only this target: the peripherals' queue is the
  # default 64 and must not be raised to 256 by a shared conf.
  - board: xiao_ble//zmk
    shield: roBakesb_prospector prospector_adapter roBakesb_keychron_link
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256
    artifact-name: roBakesb_dongle_prospector_keychron

  - board: xiao_ble//zmk
    shield: roBakesb_left roBakesb_keychron_link
    artifact-name: roBakesb_left_keychron

  - board: xiao_ble//zmk
    shield: roBakesb_right roBakesb_keychron_link
    artifact-name: roBakesb_right_keychron

  - board: nice_nano@2.0.0//zmk
    shield: roBakesb_lariska roBakesb_keychron_link
    artifact-name: roBakesb_lariska_keychron
  # -----------------------------------------------------------------------

  # Charybdis ESB dongle setup (nice!nano v2 as USB central, OLED display)
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_esb
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: charybdis_esb_dongle

  # Charybdis ESB dongle on Makerdiary nRF52840 MDK USB Dongle (no OLED)
  - board: nrf52840_mdk_dongle
    shield: charybdis_esb
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: charybdis_esb_dongle_mdk

  # Charybdis ESB dongle on Holyiot nRF52840 dongle (no OLED)
  - board: holyiot_dongle_1k
    shield: charybdis_esb
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: charybdis_esb_dongle_holyiot

  # --- Charybdis HID relay topology ---------------------------------------
  # Right half is the ESB central and the wired USB keyboard; the holyiot
  # dongle is a relay-role peripheral mirroring the keyboard, consumer and
  # pointer reports onto a second host. charybdis_esb_left and
  # charybdis_esb_lariska below serve both topologies.
  - board: nice_nano@2.0.0//zmk
    shield: charybdis_esb_right_central
    snippet: studio-rpc-usb-uart
    artifact-name: charybdis_esb_right_central

  - board: holyiot_dongle_1k
    shield: charybdis_esb_relay
    artifact-name: charybdis_esb_relay_holyiot
  # -----------------------------------------------------------------------

  - board: nice_nano@2.0.0//zmk
    shield: charybdis_esb_left
    snippet: zmk-usb-logging
    artifact-name: charybdis_esb_left

  - board: nice_nano@2.0.0//zmk
    shield: charybdis_esb_right
    snippet: zmk-usb-logging
    artifact-name: charybdis_esb_right

  - board: nice_nano@2.0.0//zmk
    shield: charybdis_esb_lariska
    snippet: zmk-usb-logging
    artifact-name: charybdis_esb_lariska

  # Corne ESB dongle setup (nice!nano v2 as USB central, OLED display)
  - board: nice_nano@2.0.0//zmk
    shield: corne_esb
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: corne_esb_dongle

  # Corne ESB dongle on Makerdiary nRF52840 MDK USB Dongle (no OLED)
  - board: nrf52840_mdk_dongle
    shield: corne_esb
    snippet: zmk-usb-logging studio-rpc-usb-uart
    artifact-name: corne_esb_dongle_mdk

  # Corne ESB dongle on Holyiot nRF52840 dongle (no OLED)
  - board: holyiot_dongle_1k
    shield: corne_esb
    snippet: studio-rpc-usb-uart
    artifact-name: corne_esb_dongle_holyiot

  # Corne halves with nice!view (stock shield stacked on top of ours)
  - board: nice_nano@2.0.0//zmk
    shield: corne_esb_left nice_view
    snippet: zmk-usb-logging
    artifact-name: corne_esb_left

  - board: nice_nano@2.0.0//zmk
    shield: corne_esb_right nice_view
    snippet: zmk-usb-logging
    artifact-name: corne_esb_right

  # Right half with a Cirque trackpad on the OLED header (no display)
  - board: nice_nano@2.0.0//zmk
    shield: corne_esb_right_cirque
    snippet: zmk-usb-logging
    artifact-name: corne_esb_right_cirque

  - board: nice_nano@2.0.0//zmk
    shield: corne_esb_lariska
    snippet: zmk-usb-logging
    artifact-name: corne_esb_lariska

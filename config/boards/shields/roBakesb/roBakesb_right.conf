CONFIG_ZMK_KEYBOARD_NAME="roBa KESB R"

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# Damex ESB peripheral, ID comes from zmk,esb-self = &esb_right
CONFIG_ZMK_SPLIT_ESB=y
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1), or equal-priority
# ISR latency can wedge the ESB ACK/retransmit state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# 56 rig-wide since split-esb v0.8.6, which added a lossy-motion-total section
# to the keepalive. Headroom again now that the uplink is back to lossless --
# lariska, the tightest node, lands at 45 of 48, and at 53 of 56 whenever
# lossy-codes goes back on, which is why the size does not follow it. Set
# uniformly so no receiver is ever the smaller end of a link; the arithmetic,
# and why it costs neither air time nor retransmit-delay margin, are in
# roBakesb_lariska.conf.
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=56
CONFIG_ESB_MAX_PAYLOAD_LENGTH=56
CONFIG_CRC=y

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_PMW3610=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ENDPOINT_RATE_NOTIFY=y


# Sleep after 2 h idle.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Blink the onboard red LED when this half's own battery is low (src/self_battery_led.c)
CONFIG_ROBA_SELF_BATTERY_LED=y
CONFIG_ROBA_SELF_BATTERY_LED_THRESHOLD=25


# Logging off entirely: drops the log thread and its 4 KB buffer, and removes
# the DBG-level string formatting that ran inside the ESB send path -- which on
# this half shares the CPU with the 1 kHz PMW3610 trackball.
# Re-enable over RTT with -DEXTRA_CONF_FILE=roBakesb_debug.conf.
CONFIG_LOG=n

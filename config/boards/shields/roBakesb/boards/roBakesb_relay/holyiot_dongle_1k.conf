# Shield-specific override, applied after boards/holyiot_dongle_1k.conf (which
# Zephyr matches on the board alone, so it lands on every roBakesb_* shield
# built for this dongle).
#
# Those two indicators are central-only: ROBA_PERIPHERAL_BATTERY_LED depends on
# ZMK_SPLIT_ROLE_CENTRAL and ROBA_LAYER_LED reads keymap layer state. The relay
# is a peripheral with no keymap, so turn them off rather than leave unmet
# dependencies in the build.
CONFIG_ROBA_PERIPHERAL_BATTERY_LED=n
CONFIG_ROBA_LAYER_LED=n

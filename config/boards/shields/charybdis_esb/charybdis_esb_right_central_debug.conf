# Debug overlay for the right-central build, for -DEXTRA_CONF_FILE together with
# the zmk-usb-logging snippet. Not picked up by the normal build.
#
# Plug the right half's USB port into a PC and it shows up as a serial console
# instead of a keyboard. ZMK's own USB (HID to a host) is off so the port is free
# for logs -- the keyboard is reachable only through the relay dongle while this
# image is on. With no host selected on this half the relay is no longer paused,
# which is the state the relay is meant to run in.
#
# USB device stack comes from ZMK_USB_LOGGING (the snippet), and usb.c enables
# it, so ZMK_USB itself is not needed. Studio and DeskHop sync both ride ZMK's
# USB HID, so they go off with it.
#
# DBG-level ESB logging costs real time on this half: on the relay dongle, the
# same console logging at a 1 ms poll made the pointer stutter. Expect this image
# to be rougher than the normal one; it is for reading the per-second stats
# lines (split-esb v0.8.11 prints them on every role at DBG).
CONFIG_ZMK_USB=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_DESKHOP_SYNC_REPORT=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# ZMK_LOG_LEVEL_WRN alone does not stick: the level still resolved to DBG and the
# console filled with pointer/listener lines (about 700/s), dropping ~38k
# messages a minute and most of the stats lines with them. Minimal logging is
# what actually silences ZMK's own debug output.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_WRN=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000

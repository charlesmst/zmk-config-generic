# Diagnostic fragment for the Prospector dongle. Not a build.yaml target.
#
#   ./local_build_roba_kesb.sh is snippet-driven, so build this one by hand:
#   see docs/prospector-dongle.md "Diagnosing a crossed-out slot".
#
# Answers one question: does the ESB central ever report a pipe connected, and
# does it ever report a battery level? The production build is CONFIG_LOG=n, so
# a crossed-out battery slot is otherwise indistinguishable between "the link
# is down" and "the link is up but the event never reached the widget".
#
# Watch the CDC console for:
#   esb display compat: pipe N connected=1   <- link up, event reached our shim
#   peripheral N battery M%                  <- battery arriving
#   esb display compat: replayed N/3 slots   <- 0 means no pipe ever reported
#
# If pipes report connected and battery lines appear but the slots stay
# crossed, the bug is between our shim and the widget. If nothing appears, the
# ESB link itself is down -- check that no second central (the holyiot dongle)
# is plugged in, since two centrals on one link table fight.

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=500

# INF, not DBG. split-esb v0.7.x compiles its own library with
# -Werror -Wstack-usage=256, and at DBG esb_link_init measures 264 bytes
# because esb_link_radio_setup's six LOG_DBG calls get inlined into it.
# DBG here does not build at all.
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_INF=y

# Promotes the central's per-peripheral battery line from DBG to INF, so it
# survives the INF ceiling above.
CONFIG_ZMK_SPLIT_ESB_BATTERY_LOG=y

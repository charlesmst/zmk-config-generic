CONFIG_ZMK_KEYBOARD_NAME="roBa KESB Keychron"

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=n
# The USB-C port is charge-only here: the board talks to the dongle over ESB.
CONFIG_ZMK_USB=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# Damex ESB peripheral, ID comes from zmk,esb-self = &esb_keychron
CONFIG_ZMK_SPLIT_ESB=y
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1), or equal-priority
# ISR latency can wedge the ESB ACK/retransmit state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
# 56 rig-wide, set uniformly so no receiver is ever the smaller end of a link;
# the arithmetic is in roBakesb_lariska.conf. With no sensors this lands where
# the right half does, at 29 bytes of the worst-case keepalive.
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=56
CONFIG_ESB_MAX_PAYLOAD_LENGTH=56
CONFIG_CRC=y

CONFIG_GPIO=y

# Sleep after 2 h idle, as the stock firmware does. Wakes on any key.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Blink the red LED (led0 on the board) when this keyboard's own battery is low
CONFIG_ROBA_SELF_BATTERY_LED=y
CONFIG_ROBA_SELF_BATTERY_LED_THRESHOLD=25

# Logging off, as on every other roBakesb peripheral.
CONFIG_LOG=n

manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: charlesmst
      url-base: https://github.com/charlesmst
    - name: hsgw
      url-base: https://github.com/hsgw
    - name: damex
      url-base: https://github.com/damex
    - name: nrfconnect
      url-base: https://github.com/nrfconnect
    - name: urob
      url-base: https://github.com/urob
    - name: ggrocer
      url-base: https://github.com/greengrocer98

  projects:
    - name: zmk
      remote: charlesmst
      revision: feat/deskhop-sync
      import: app/west.yml

    - name: zmk-pmw3610-driver
      remote: charlesmst
      repo-path: zmk-pmw3610-driver-efog
      revision: zmk0.4

    - name: zmk-paw3395-driver
      remote: ggrocer
      revision: main

    - name: zmk-vfx-rgbled-indicator
      remote: ggrocer
      revision: main

    # charlesmst fork: adds a zmk_display_status_screen() prototype so the
    # module's -Werror=missing-prototypes build passes against ZMK's K&R header.
    - name: zmk-vfx-retro
      remote: charlesmst
      revision: compat/zmk-status-screen-prototype

    - name: zmk-input-processor-accel
      remote: charlesmst
      revision: main

    - name: zmk-tri-state
      path: modules/zmk/tri-state
      remote: charlesmst
      revision: feat/hold-start

    - name: zmk-behavior-stepped-scroll
      remote: damex
      revision: main

    - name: zmk-behavior-button-direct
      remote: damex
      revision: v0.1.1

    # v0.1.1 drops -Wduplicated-branches from the module's own -Werror set.
    # v0.1.0 could not build: Zephyr's Z_CBPRINTF_IS_X_PCHAR expands to
    # `cond ? 0 : 0` for non-pointer args, so LOG_ERR("...(%d)", error) in
    # stepped_encoder.c failed under GCC 12.2 (SDK 0.16.x, incl. ZMK's CI image).
    - name: zmk-driver-stepped-encoder
      remote: damex
      revision: v0.1.1

    - name: zmk-feature-sensor_rotation
      remote: hsgw
      revision: main

    # v0.8.1 is the first release where the HID relay carries pointer input:
    # v0.8.0 added the relay pointer processor plus the "central has its own
    # host" pause, v0.8.1 queues mouse button changes like key changes so a
    # click shorter than one relay poll still reaches the host.
    #
    # v0.8.2 stops the pointer from riding every idle ACK. esb_hid_relay_pointer_take
    # now returns 0 unless there is motion or the keepalive marked a refresh due,
    # so an idle poll's ACK is empty like a normal half's instead of carrying a
    # 9-byte mouse report 1000 times a second. That is what makes POLL_MS=2 /
    # KEEPALIVE_MS=4 a cheaper setting than 1/1 was rather than a slower one.
    #
    # v0.8.3 fixes the uplink half of the same problem. The dongle had no poll of
    # its own: keepalive_work_fn had a force_fast branch that reused the keepalive
    # as the poll, so every poll sent a full state snapshot and the central queued
    # each one into the SPSC ring for position reconcile. Now a dedicated
    # relay_poll_work tick sends one byte (ESB_RELAY_POLL_TAG, 0xFB -- one byte
    # because NCS refuses an empty payload), hop_consume_rx stamps heard/rssi and
    # returns true so it is never queued, and the ACK still carries the HID
    # reports. The dongle's keepalive goes back to the hop_window_ms pace.
    #
    # Wire change: control tags now start at 0xFB, not 0xFC. An old central
    # mis-routes a 0xFB poll as an event packet, so central and dongle must be
    # flashed together. Half keepalive wire format is unchanged.
    #
    # v0.8.4 repairs a side effect of that split. The dongle's hop decisions --
    # settle_link_state, ensure_mask, the retransmit budget -- used to ride the
    # keepalive tick, which was the poll tick; once v0.8.3 moved the poll off it,
    # those decisions dropped to the hop_window_ms pace (32 ms default) and the
    # dongle stopped adapting between polls. v0.8.4 extracts run_hop_window() and
    # calls it from relay_poll_work_fn, skipping it in keepalive_work_fn for a
    # relay: "a window grades by its worst packet, so a relay steps one per poll."
    #
    # Peripheral-side only, no wire change -- hop_peripheral.c is the only src
    # file touched, so the dongle alone needs flashing. The halves are
    # functionally unchanged too: for a non-relay the refactor is the same code
    # inline, and `fast` collapses to the old (active || searching).
    #
    # v0.8.5 reverts that. f8ff827 folds run_hop_window() back into
    # keepalive_work_fn and drops the call from relay_poll_work_fn, so the relay
    # steps its hop windows on the keepalive "exactly like the halves do" --
    # hop_window_ms, not the poll period. Grading a window on a 2 ms cadence
    # evidently judged the channel on too little evidence. So POLL_MS no longer
    # has anything to do with hop adaptation; see roBakesb_relay.conf.
    #
    # caa9cc6 in the same release grades a peripheral hop window by its mean TX
    # attempts, rounded up, rather than by its worst packet. That is the common
    # peripheral path in connected_window(), so it changes hop sensitivity on
    # roBakesb_left/right/lariska as well as the dongle -- less trigger-happy on
    # a single bad packet. Radio behaviour, not something a build can confirm.
    - name: zmk-feature-split-esb
      remote: damex
      revision: v0.8.5
      import: true

  self:
    path: config

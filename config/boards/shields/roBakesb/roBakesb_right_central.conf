CONFIG_ZMK_KEYBOARD_NAME="roBa KESB"

# Wired USB central. No BLE anywhere in this build.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# ZMK Studio over USB (studio-rpc-usb-uart snippet, see build.yaml).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Damex ESB central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=48
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1), or equal-priority
# ISR latency can wedge the ESB ACK/retransmit state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_CRC=y

# Mirror the keyboard HID report onto every relay-role pipe, so the holyiot
# dongle (roBakesb_relay) can present it on its own USB HID endpoint.
# Keepalive matches the relay's poll period so each poll returns a fresh report.
CONFIG_ZMK_SPLIT_ESB_HID_RELAY=y
CONFIG_ZMK_SPLIT_ESB_HID_RELAY_POLL_MS=4
CONFIG_ZMK_SPLIT_ESB_HID_RELAY_KEEPALIVE_MS=4

# Local PMW3610 trackball on SPI0
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_PMW3610=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ENDPOINT_RATE_NOTIFY=y

CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Wired central: never deep-sleep, that would drop USB and the ESB link.
CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Logging
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_WRN=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=500

# DeskHop layer sync via vendor HID collection (output A=layer 0, B=layer 1).
# Only this half is wired to DeskHop, so the sync reports land here; the relay
# dongle just mirrors whatever keyboard report results.
CONFIG_ZMK_DESKHOP_SYNC_REPORT=y
CONFIG_ZMK_DESKHOP_SYNC_LAYER_A=0
CONFIG_ZMK_DESKHOP_SYNC_LAYER_B=1
# Base layers a switch must clear: Mac(0) | Windows(1) | Gaming(2). Gaming sits
# above both base layers, so without it in the mask it shadows whichever one
# DeskHop selects and the switch looks like it did nothing.
CONFIG_ZMK_DESKHOP_SYNC_BASE_LAYER_MASK=0x07

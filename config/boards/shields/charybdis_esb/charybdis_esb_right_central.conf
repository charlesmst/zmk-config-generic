CONFIG_ZMK_KEYBOARD_NAME="Charybdis ESB"

# Wired USB central. No BLE anywhere in this build.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# ZMK Studio over USB (studio-rpc-usb-uart snippet, see build.yaml). Locking
# disabled so no physical &studio_unlock gesture is required to edit.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Damex ESB central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_ESB=y
# 56 rig-wide: lariska's keepalive hits 53 bytes with the lossy REL_X/REL_Y
# section declared in charybdis_esb_addr.dtsi.
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=56
CONFIG_ESB_MAX_PAYLOAD_LENGTH=56
# Radio ISR must preempt SPIM/USBD/GPIOTE (all default priority 1), or equal-priority
# ISR latency can wedge the ESB ACK/retransmit state machine.
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_CRC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Mirror the keyboard, consumer and pointer HID reports onto every relay-role
# pipe, so the holyiot dongle (charybdis_esb_relay) can present them on its own
# USB HID endpoint. Pointer input needs the relay_pointer processor in every
# input listener here as well, see charybdis_esb_right_central.overlay.
#
# Keepalive is the central's refresh of the *idle* reply, not the path a
# keypress takes: a real change is queued and goes out on the next poll
# regardless. The refresh is the heal path for a dropped release or lost button,
# and since v0.8.2 it also bounds how long a lost mouse button stays lost. 4 ms
# is two relay polls at the 1 ms relay poll, far under what a host can notice,
# and keeps the refresh work off this half's system workqueue (matrix scan,
# PMW3610 and DeskHop sync run there too). First knob to back off if this half
# looks starved, first to tighten if a lost button looks slow to heal.
#
# The relay goes quiet (released keys, zeroed pointer) while this half has a
# host of its own, which with CONFIG_ZMK_USB=y means whenever its USB is
# enumerated.
CONFIG_ZMK_SPLIT_ESB_HID_RELAY=y
CONFIG_ZMK_SPLIT_ESB_HID_RELAY_KEEPALIVE_MS=4

# Local PMW3610 trackball on SPI0 (same efogtech driver as the peripheral build)
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_PMW3610=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ENDPOINT_RATE_NOTIFY=y
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=50

# hsgw sensor_rotation input processor (orientation correction, true rotation)
CONFIG_SENSOR_ROTATION=y

CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Wired central: never deep-sleep, that would drop USB and the ESB link.
CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Logging off entirely. This half is the ESB central and runs the retransmit
# budget tuned in charybdis_esb_addr.dtsi, so string formatting has no business
# in that path. No log backend here either -- the studio-rpc-usb-uart snippet is
# an RPC transport, not a log backend.
CONFIG_LOG=n

# DeskHop layer sync via vendor HID collection (output A=layer 0, B=layer 1).
# Only this half is wired to DeskHop; the relay dongle just mirrors whatever
# keyboard report results.
CONFIG_ZMK_DESKHOP_SYNC_REPORT=y
CONFIG_ZMK_DESKHOP_SYNC_LAYER_A=0
CONFIG_ZMK_DESKHOP_SYNC_LAYER_B=1

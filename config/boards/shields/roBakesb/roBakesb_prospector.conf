CONFIG_ZMK_KEYBOARD_NAME="roBa KESB"

# USB dongle — no BLE to host
CONFIG_ZMK_USB=y

# ZMK Studio — runtime keymap editing over USB. Runs on the central (dongle);
# transport is the studio-rpc-usb-uart snippet (see build.yaml).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# Damex ESB central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=48
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_CRC=y

# Mouse / trackball via split
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_GPIO=y

CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Three ESB peripherals: pipe 0 left, 1 right, 2 lariska (roBakesb_addr.dtsi).
# Unlike on the other dongles this value is now live, not decoration: the repo
# Kconfig declares ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS unconditionally so the
# Prospector battery widgets can size their arrays from it. One bar per pipe.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3
# The ESB central raises peripheral_battery_state_changed itself, and only
# while BLE's own fetching is off (zmk-feature-split-esb central.c).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Logging off, as on every other roBakesb target. Studio is unaffected --
# studio-rpc-usb-uart is an RPC transport, not a log backend.
# Re-enable over RTT with -DEXTRA_CONF_FILE=roBakesb_debug.conf.
CONFIG_LOG=n

# DeskHop layer sync via vendor HID collection (output A=layer 0, B=layer 1).
# This is the automatic base-layer switch: DeskHop flips host, the vendor HID
# feature report lands here, and the keymap follows. The Prospector's layer
# roller then shows the switch happening, which the LED-only dongles could not.
CONFIG_ZMK_DESKHOP_SYNC_REPORT=y
CONFIG_ZMK_DESKHOP_SYNC_LAYER_A=0
CONFIG_ZMK_DESKHOP_SYNC_LAYER_B=1
# Base layers a switch must clear: Mac(0) | Windows(1) | Gaming(2). Gaming sits
# above both base layers, so without it in the mask it shadows whichever one
# DeskHop selects and the switch looks like it did nothing.
CONFIG_ZMK_DESKHOP_SYNC_BASE_LAYER_MASK=0x07

# --- Display -----------------------------------------------------------------
# prospector_adapter supplies the panel, the status screen and the LVGL tuning
# via its Kconfig.defconfig, so almost nothing is set here. It also defaults
# ZMK_DISPLAY and ZMK_DISPLAY_STATUS_SCREEN_CUSTOM for us.
#
# Our own dongle screen stays off: ROBA_DONGLE_BATTERY_DISPLAY also defines
# zmk_display_status_screen(), so enabling both would be a duplicate symbol at
# link time. Prospector's screens already cover what it drew -- layer plus a
# battery readout per peripheral -- which is the point of the swap.
CONFIG_ROBA_DONGLE_BATTERY_DISPLAY=n

# No RGB LED and no OLED-era indicators on this dongle; the screen replaces
# both. Left explicit because the other dongles turn them on.
CONFIG_ROBA_PERIPHERAL_BATTERY_LED=n
CONFIG_ROBA_LAYER_LED=n

# Blank the panel after 5 minutes idle. Key events arriving over ESB count as
# activity, so it only sleeps when the keyboard does.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Classic is Prospector's default status screen; set it explicitly so a
# different upstream default cannot silently change the layout.
CONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y

# Auto brightness from the APDS9960. Drop to a fixed level by setting this to
# n and PROSPECTOR_FIXED_BRIGHTNESS to 1-100 if the sensor is not populated --
# it is the optional part of the BOM.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y
